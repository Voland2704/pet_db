name: CI Pipeline

# Запускать при каждом push в main и при создании Pull Request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest # Используем свежий Ubuntu от GitHub
    
    steps:
    # 1. Скачиваем код репозитория
    - name: Checkout code
      uses: actions/checkout@v4
      
    # 2. Устанавливаем Python нужной версии
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip' # Кэшируем зависимости для ускорения следующих запусков
        
    # 3. Устанавливаем зависимости из requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # 4. Запускаем тесты и проверяем форматирование (опционально)
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short
        
    # 5. (Бонус) Проверка линтером Ruff (показывает заботу о качестве кода)
    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check .
